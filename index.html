<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Downloads — Jogos, Apps e Ferramentas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header fixo (todas as páginas) -->
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">📦 Nexus<span>Downloads</span></a>
      <nav class="site-nav">
        <a class="nav-link active" href="index.html">🏠 INICIO</a>
        <a class="nav-link" href="search.html">🔍 BUSCAR</a>
      </nav>
    </div>
  </header>

  <!-- Barra de plataformas (página inicial) -->
  <div class="platform-bar">
    <div class="platform-inner">
      <nav id="categories" class="platform-nav"></nav>
      <div class="search-box">
        <input id="search" type="search" placeholder="🔍 Buscar..." autocomplete="off" />
      </div>
    </div>
  </div>

  <!-- Barra de gêneros -->
  <div id="genreBar" class="genre-bar" hidden>
    <div class="genre-bar-inner">
      <span class="genre-label">GÊNEROS</span>
      <div id="genreChips" class="genre-chips"></div>
    </div>
  </div>

  <!-- Carrossel -->
  <section id="carousel" class="hero-carousel" aria-label="Destaque do momento"></section>

  <main class="container">
    <div class="results-bar">
      <span id="resultCount"></span>
    </div>
    <div id="rows"></div>
    <div id="empty" class="empty" hidden>Nenhum item encontrado.</div>
  </main>

  <footer class="footer">
    <p>Hospedado no GitHub Pages · <a href="#" id="repoLink" target="_blank">ver repositório</a></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
