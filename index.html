<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Downloads — Jogos, Apps e Ferramentas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 class="logo">📦 Nexus<span>Downloads</span></h1>
      <p class="tagline">Jogos, aplicativos, ferramentas e arquivos — tudo em um lugar.</p>
      <div class="search-box">
        <input id="search" type="search" placeholder="🔍 Buscar por nome..." autocomplete="off" />
      </div>
      <nav id="categories" class="categories"></nav>
    </div>
  </header>

  <main class="container">
    <div id="sections" class="sections"></div>

    <div id="resultsArea" hidden>
      <div class="results-bar">
        <span id="resultCount"></span>
        <button id="backToSections" class="ver-mais" style="display:none" type="button">← Voltar aos destaques</button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>Nenhum item encontrado.</div>
    </div>
  </main>

  <footer class="footer">
    <p>Hospedado no GitHub Pages · <a href="#" id="repoLink" target="_blank">ver repositório</a></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
